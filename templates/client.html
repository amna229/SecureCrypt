<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<title>dashboard</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        font-family: "Space Grotesk", sans-serif;

        background: linear-gradient(
            135deg,
            #0f172a,
            #1e1b4b
        );

        color: white;
    }

    .main-content-box {
        width: 90%;
        max-width: 800px;

        padding: 50px 60px;

        background: rgba(255, 255, 255, 0.08);

        border: 1px solid rgba(255, 255, 255, 0.15);

        border-radius: 20px;

        box-shadow:
            0 20px 50px rgba(0, 0, 0, 0.35);

        backdrop-filter: blur(10px);
    }

    h1 {
        margin: 0 0 30px 0;

        font-size: 36px;

        font-weight: 600;

        text-align: center;
    }

    h3 {
        margin-top: 30px;
        margin-bottom: 20px;

        font-size: 20px;
    }

    .tabs {
        display: flex;
        justify-content: center;
        gap: 10px;

        margin-bottom: 40px;
    }

    .tab {
        padding: 12px 30px;

        border: none;

        border-bottom: 2px solid transparent;

        background: transparent;

        color: #cbd5e1;

        font-family: inherit;

        font-size: 16px;

        cursor: pointer;

        transition:
            color 0.2s,
            border-color 0.2s;
    }

    .tab:hover {
        color: white;
    }

    .tab.active {
        color: white;

        border-bottom: 2px solid #6366f1;
    }

    .radio-group {
        display: flex;
        gap: 30px;
    }

    .radio-option,
    .checkbox-option {
        display: flex;
        align-items: center;
        gap: 10px;

        margin-bottom: 12px;

        color: #e2e8f0;

        cursor: pointer;
    }

    input[type="radio"],
    input[type="checkbox"] {
        width: 17px;
        height: 17px;

        accent-color: #6366f1;

        cursor: pointer;
    }

    .options-section {
        margin-top: 10px;
    }

    .error-message {
        display: none;

        margin-top: 15px;

        color: #f87171;

        font-size: 15px;
    }

    .error-message.visible {
        display: block;
    }

    .save-button {
        margin-top: 30px;

        padding: 14px 40px;

        border: none;

        border-radius: 10px;

        background: linear-gradient(
            135deg,
            #6366f1,
            #8b5cf6
        );

        color: white;

        font-family: inherit;

        font-size: 17px;

        font-weight: 600;

        cursor: pointer;

        transition:
            transform 0.2s,
            box-shadow 0.2s,
            opacity 0.2s;
    }

    .save-button:hover:not(:disabled) {
        transform: translateY(-2px);

        box-shadow:
            0 10px 25px rgba(99, 102, 241, 0.4);
    }

    .save-button:active:not(:disabled) {
        transform: translateY(0);
    }

    .save-button:disabled {
        opacity: 0.4;

        cursor: not-allowed;
    }

</style>


</head>

<body>

<div class="main-content-box">


<div class="tabs">

    <button
        class="tab"
        onclick="window.location.href='/server'"
    >
        Servidor
    </button>

    <button
        class="tab active"
        onclick="window.location.href='/client'"
    >
        Cliente
    </button>

</div>


<h1>Configuración del cliente</h1>


<h3>
    Por favor selecciona el modo de intercambio de clave:
</h3>


<div class="radio-group">

    <label class="radio-option">

        <input
            type="radio"
            name="key_exchange"
            value="classical"
            checked
        >

        Clásico

    </label>


    <label class="radio-option">

        <input
            type="radio"
            name="key_exchange"
            value="post_quantum"
        >

        Post-Cuántico

    </label>

</div>


<h3>
    Cipher Suites
</h3>


<div class="options-section">

    <label class="checkbox-option">

        <input
            type="checkbox"
            name="cipher_suites"
            value="TLS13_AES_256_GCM_SHA384"
            checked
        >

        TLS13_AES_256_GCM_SHA384

    </label>


    <label class="checkbox-option">

        <input
            type="checkbox"
            name="cipher_suites"
            value="TLS13_AES_128_GCM_SHA256"
            checked
        >

        TLS13_AES_128_GCM_SHA256

    </label>


    <label class="checkbox-option">

        <input
            type="checkbox"
            name="cipher_suites"
            value="TLS13_CHACHA20_POLY1305_SHA256"
            checked
        >

        TLS13_CHACHA20_POLY1305_SHA256

    </label>

</div>


<div
    id="cipher-error"
    class="error-message"
>
    Debes seleccionar al menos una Cipher Suite.
</div>


<h3>
    KX Groups
</h3>


<div
    id="classical-kx"
    class="options-section"
>

    <label class="checkbox-option">

        <input
            type="checkbox"
            name="kx_groups"
            value="secp256r1"
            checked
        >

        SECP256R1

    </label>


    <label class="checkbox-option">

        <input
            type="checkbox"
            name="kx_groups"
            value="secp384r1"
            checked
        >

        SECP384R1

    </label>


    <label class="checkbox-option">

        <input
            type="checkbox"
            name="kx_groups"
            value="X25519"
            checked
        >

        X25519

    </label>

</div>


<div
    id="post-quantum-kx"
    class="options-section"
    style="display: none;"
>

    <label class="checkbox-option">

        <input
            type="checkbox"
            name="kx_groups"
            value="MLKEM768"
            checked
        >

        MLKEM768

    </label>


    <label class="checkbox-option">

        <input
            type="checkbox"
            name="kx_groups"
            value="MLKEM1024"
            checked
        >

        MLKEM1024

    </label>

</div>


<div
    id="kx-error"
    class="error-message"
>
    Debes seleccionar al menos un KX Group.
</div>



<h3>Número de conexiones:</h3>

<div>

    <input
            type="number"
            id="num-connections"
            name="num_connections"
            min="1"
            max="1000"
            value="1"
        >

</div>



<button
    id="save-button"
    class="save-button"
    type="button"
>
    Guardar
</button>



</div>

<script>

    const classicalRadio =
        document.querySelector(
            'input[value="classical"]'
        );


    const postQuantumRadio =
        document.querySelector(
            'input[value="post_quantum"]'
        );


    const classicalKx =
        document.getElementById(
            "classical-kx"
        );


    const postQuantumKx =
        document.getElementById(
            "post-quantum-kx"
        );


    const cipherCheckboxes =
        document.querySelectorAll(
            'input[name="cipher_suites"]'
        );


    const numConnections =
        document.getElementById(
            "num-connections"
        );


    const saveButton =
        document.getElementById(
            "save-button"
        );


    const cipherError =
        document.getElementById(
            "cipher-error"
        );


    const kxError =
        document.getElementById(
            "kx-error"
        );


    function updateKxGroups() {

        if (classicalRadio.checked) {

            classicalKx.style.display = "block";

            postQuantumKx.style.display = "none";

        }

        else {

            classicalKx.style.display = "none";

            postQuantumKx.style.display = "block";

        }

        updateValidation();

    }


    function updateValidation() {

        const selectedCiphers =
            document.querySelectorAll(
                'input[name="cipher_suites"]:checked'
            );


        const activeKxContainer =
            classicalRadio.checked
                ? classicalKx
                : postQuantumKx;


        const selectedKx =
            activeKxContainer.querySelectorAll(
                'input[name="kx_groups"]:checked'
            );


        const noCiphersSelected =
            selectedCiphers.length === 0;


        const noKxSelected =
            selectedKx.length === 0;


        const invalidNumConnections =
            numConnections.value < 1 ||
            numConnections.value > 1000;


        cipherError.classList.toggle(
            "visible",
            noCiphersSelected
        );


        kxError.classList.toggle(
            "visible",
            noKxSelected
        );


        saveButton.disabled =
            noCiphersSelected ||
            noKxSelected ||
            invalidNumConnections;

    }


    numConnections.addEventListener(
        "input",
        function () {

            if (this.value > 1000) {

                this.value = 1000;

            }

            if (this.value < 1) {

                this.value = 1;

            }

            updateValidation();

        }
    );


    classicalRadio.addEventListener(
        "change",
        updateKxGroups
    );


    postQuantumRadio.addEventListener(
        "change",
        updateKxGroups
    );


    cipherCheckboxes.forEach(
        checkbox => {

            checkbox.addEventListener(
                "change",
                updateValidation
            );

        }
    );


    document
        .querySelectorAll(
            'input[name="kx_groups"]'
        )
        .forEach(
            checkbox => {

                checkbox.addEventListener(
                    "change",
                    updateValidation
                );

            }
        );


    updateKxGroups();


    saveButton.addEventListener(
        "click",
        async function () {

            const selectedKeyExchange =
                document.querySelector(
                    'input[name="key_exchange"]:checked'
                ).value;


            const selectedCiphers =
                Array.from(
                    document.querySelectorAll(
                        'input[name="cipher_suites"]:checked'
                    )
                ).map(
                    checkbox => checkbox.value
                );


            const activeKxContainer =
                classicalRadio.checked
                    ? classicalKx
                    : postQuantumKx;


            const selectedKx =
                Array.from(
                    activeKxContainer.querySelectorAll(
                        'input[name="kx_groups"]:checked'
                    )
                ).map(
                    checkbox => checkbox.value
                );


            const config = {

                key_exchange:
                    selectedKeyExchange,

                cipher_suites:
                    selectedCiphers,

                kx_groups:
                    selectedKx,

                num_connections:
                    Number(numConnections.value)

            };


            const response =
                await fetch(
                    "/info/client",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(config)
                    }
                );


            console.log(
                "Respuesta del servidor:",
                response.status
            );

        }
    );

</script>

</body>

</html>
